
<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>내 영화 보드</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <script src="data.js" defer></script>
    <script src="app.js" defer></script>
</head>

<body>

    <header class="top">
        <h1>🎬 내 영화 보드</h1>

        <nav>
            <ul>
                <li><a href="#home">홈</a></li>
                <li><a href="#boardSection">영화 보드</a></li>
                <li><a href="#about">소개</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero" id="home">
        <h2>영화 켤랙션</h2>
        <p>내가 좋아하는 영화와 박스오피스 영화.</p>
        <a href="#boardSection" class="hero-link">영화 보러 </a>
    </section>

    <main id="boardSection">

        <section class="toolbar">
            <input
                type="search"
                id="q"
                placeholder="영화 제목 검색..."
                aria-label="영화 검색"
            >

            <select id="typeFilter" aria-label="영화 종류">
                <option value="all">전체 영화</option>
                <option value="mine">내가 고른 영화</option>
                <option value="boxoffice">박스오피스</option>
            </select>

            <select id="sort" aria-label="영화 정렬">
                <option value="date-desc">최신 개봉순</option>
                <option value="date-asc">오래된 개봉순</option>
                <option value="rating-desc">평점 높은순</option>
                <option value="rating-asc">평점 낮은순</option>
                <option value="title-asc">제목 가나다순</option>
                <option value="year-desc">연도 최신순</option>
            </select>
        </section>

        <section class="stats">
            <div class="stat">
                <span>전체 영화</span>
                <strong id="count">0</strong>
            </div>

            <div class="stat">
                <span>좋아요</span>
                <strong id="likeCount">0</strong>
            </div>

            <div class="stat">
                <span>평균 평점</span>
                <strong id="average">0</strong>
            </div>

            <div class="stat">
                <span>최고 평점 영화</span>
                <strong id="best">-</strong>
            </div>
        </section>

        <section class="movie-section">
            <h2>🎥 Movie Collection</h2>

            <div class="board" id="board"></div>

            <p class="state-empty" id="empty">
                검색 결과가 없습니다.
            </p>
        </section>

    </main>

    <section id="about">
        <h2>About</h2>
        <p>내가 좋아하는 영화와 다양한 영화를 소개하는 나만의 영화 보드입니다.</p>
    </section>

    <footer>
        <p>웹개발기초 | 나만의 영화 보드</p>
    </footer>

    <dialog id="detail">
        <button type="button" id="closeDetail" class="close-detail">
            ✕ 닫기
        </button>

        <div id="detailBody"></div>
    </dialog>

</body>
</html>
